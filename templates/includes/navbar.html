<header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 sticky top-0 z-30">

    <!-- Left -->
    <div class="flex items-center gap-4">

        <button class="lg:hidden text-xl">
            <i class="fa-solid fa-bars"></i>
        </button>

        <div>
            <h1 class="text-xl font-bold text-slate-800">
                Dashboard
            </h1>

            <p class="text-sm text-gray-500">
                Welcome back, Administrator 👋
            </p>
        </div>

    </div>

    <!-- Center Search -->
    <div class="hidden md:block w-full max-w-md mx-10">

        <div class="relative">

            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>

            <input
                type="text"
                placeholder="Search..."
                class="w-full pl-11 pr-4 h-11 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500">

        </div>

    </div>

    <!-- Right -->
    <div class="flex items-center gap-5">

        <!-- Notification -->

        <button class="relative">

            <i class="fa-regular fa-bell text-xl text-gray-600"></i>

            <span
                class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-red-500 text-white text-xs flex items-center justify-center">

                3

            </span>

        </button>

        <!-- Settings -->

        <button>

            <i class="fa-solid fa-gear text-xl text-gray-600"></i>

        </button>

        <!-- User -->

        <div class="flex items-center gap-3">

            <div
                class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold">

                A

            </div>

            <div class="hidden md:block">

                <h4 class="font-semibold">

                    Administrator

                </h4>

                <p class="text-sm text-gray-500">

                    Super Admin

                </p>

            </div>

        </div>

    </div>

</header>
