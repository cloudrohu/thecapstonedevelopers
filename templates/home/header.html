{% load static %}



<header class="w-full bg-[#fafafa] border-y border-gray-200">
  <div class="mx-auto flex min-h-[96px] w-full items-center justify-between gap-4 px-5 sm:px-8 lg:px-[3%]">

    <!-- Logo -->
    <a href="#" class="flex shrink-0 flex-col items-center text-[#171717]">
        <img src="{{settings_obj.logo.url}}" alt="Logo" class="h-10 w-auto sm:h-12">
    </a>

    <!-- Project Details -->
    <div class="ml-auto flex flex-col items-end text-right">
      <h1 class="text-lg font-normal leading-7 text-[#171717] sm:text-[22px]">
        The Beamonde
      </h1>

      <div class="flex flex-wrap items-center justify-end gap-x-3 gap-y-1 text-sm text-gray-500 sm:gap-x-5 sm:text-base">

        <!-- Building Icon -->
        <span class="flex items-center gap-2">
          <svg class="h-6 w-6 text-gray-400" fill="none"
               stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-width="1.4" stroke-linecap="round"
              stroke-linejoin="round"
              d="M4 21V5l10-3v19M4 21h16M14 8h6v13M8 8h2M8 12h2M8 16h2M17 12h1M17 16h1"/>
          </svg>
          <span>4 &amp; 5 BHK Luxurious Living</span>
        </span>

        <!-- Location Icon -->
        <span class="flex items-center gap-2">
          <svg class="h-6 w-6 text-gray-400" fill="none"
               stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-width="1.4" stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 21V9m-4 0V5m8 4V5M5 9h14M8 5h8M12 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
          </svg>
          <span>Thaltej</span>
        </span>
      </div>
    </div>

    <!-- Contact Button -->
    <a href="#contact"
       class="ml-2 flex h-[50px] shrink-0 items-center justify-center gap-4 rounded-full border border-black px-5 text-[12px] font-medium tracking-wide text-gray-900 transition-all duration-300 hover:bg-black hover:text-white sm:ml-6 sm:min-w-[192px] sm:gap-5 sm:px-7">
      <span>CONTACT US</span>
      <svg class="h-5 w-5" fill="none" stroke="currentColor"
           viewBox="0 0 24 24">
        <path stroke-width="1.8" stroke-linecap="round"
              d="M12 5v14M5 12h14"/>
      </svg>
    </a>

  </div>
</header>
