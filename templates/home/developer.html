{% extends "home/base.html" %}

{% block content %}


<style>
    .developer-content {
        color: #475569;
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 15px;
        line-height: 1.9;
        overflow-wrap: anywhere;
        word-break: normal;
    }

    /* Main headings */
    .developer-content h1 {
        font-size: clamp(28px, 4vw, 40px);
        font-weight: 800;
        color: #172033;
        line-height: 1.25;
        margin: 40px 0 20px;
        letter-spacing: -0.8px;
    }

    .developer-content h2 {
        font-size: clamp(22px, 3vw, 30px);
        font-weight: 750;
        color: #172033;
        line-height: 1.35;
        margin: 38px 0 16px;
        padding-left: 16px;
        border-left: 4px solid #c89b2c;
    }

    .developer-content h3 {
        font-size: 20px;
        font-weight: 700;
        color: #273449;
        margin: 28px 0 12px;
        line-height: 1.5;
    }

    .developer-content h4,
    .developer-content h5,
    .developer-content h6 {
        color: #273449;
        font-weight: 700;
        margin: 24px 0 10px;
    }

    /* Paragraphs */
    .developer-content p {
        margin: 0 0 18px;
        color: #596579;
    }

    .developer-content strong,
    .developer-content b {
        color: #263348;
        font-weight: 700;
    }

    /* Lists */
    .developer-content ul,
    .developer-content ol {
        margin: 18px 0 24px;
        padding-left: 28px;
        color: #596579;
    }

    .developer-content ul {
        list-style-type: disc;
    }

    .developer-content ol {
        list-style-type: decimal;
    }

    .developer-content li {
        padding-left: 5px;
        margin-bottom: 10px;
    }

    .developer-content li::marker {
        color: #c89b2c;
        font-weight: 700;
    }

    .developer-content li > p {
        margin-bottom: 8px;
    }

    /* Links */
    .developer-content a {
        color: #a77b13;
        text-decoration: underline;
        text-underline-offset: 4px;
        overflow-wrap: anywhere;
        transition: color .2s ease;
    }

    .developer-content a:hover {
        color: #78570b;
    }

    /* Images */
    .developer-content img {
        display: block;
        max-width: 100%;
        height: auto;
        border-radius: 14px;
        margin: 24px auto;
        box-shadow: 0 8px 28px rgba(15, 23, 42, .09);
    }

    /* Tables */
    .developer-content table {
        width: 100%;
        max-width: 100%;
        border-collapse: collapse;
        margin: 24px 0;
        font-size: 14px;
        overflow-wrap: anywhere;
    }

    .developer-content th {
        background: #f5f1e7;
        color: #273449;
        font-weight: 700;
        text-align: left;
    }

    .developer-content th,
    .developer-content td {
        border: 1px solid #e5e7eb;
        padding: 12px 15px;
        vertical-align: top;
    }

    .developer-content tr:nth-child(even) td {
        background: #fafaf9;
    }

    /* Blockquote */
    .developer-content blockquote {
        margin: 28px 0;
        padding: 22px 24px;
        border-left: 4px solid #c89b2c;
        border-radius: 0 12px 12px 0;
        background: #faf7ef;
        color: #475569;
        font-size: 16px;
        font-style: italic;
    }

    .developer-content blockquote p:last-child {
        margin-bottom: 0;
    }

    /* Horizontal line */
    .developer-content hr {
        border: 0;
        border-top: 1px solid #e5e7eb;
        margin: 32px 0;
    }

    /* CKEditor alignment */
    .developer-content .text-align-center,
    .developer-content [style*="text-align: center"] {
        text-align: center;
    }

    .developer-content [style*="text-align: right"] {
        text-align: right;
    }

    .developer-content [style*="text-align: justify"] {
        text-align: justify;
    }

    /* Mobile */
    @media (max-width: 640px) {
        .developer-content {
            font-size: 14px;
            line-height: 1.8;
        }

        .developer-content h1 {
            margin-top: 28px;
        }

        .developer-content h2 {
            margin-top: 30px;
            padding-left: 12px;
        }

        .developer-content h3 {
            font-size: 18px;
        }

        .developer-content table {
            display: block;
            overflow-x: auto;
        }

        .developer-content th,
        .developer-content td {
            padding: 10px;
            min-width: 110px;
        }
    }
</style>

<!-- DEVELOPER ABOUT CONTENT -->
<section class="relative overflow-hidden bg-[#f7f8fa] px-4 py-24s sm:px-6 sm:py-16 lg:px-8 lg:py-24">

    <div class="mx-auto w-full max-w-6xl">

        <!-- Content Card -->
        <div class="overflow-hidden rounded-2xl border border-gray-200/80 bg-white shadow-[0_12px_50px_rgba(15,23,42,0.06)]">

            <!-- Top Accent -->
            <div class="h-1.5 w-full bg-gradient-to-r from-[#a77b13] via-[#d6b65d] to-[#f5e8b7]"></div>

            <!-- CKEditor Content -->
            <div class="px-5 py-7 sm:px-9 sm:py-10 lg:px-14 lg:py-12">
                <div class="developer-content">
                    {{ project_obj.developer.read_more|safe }}
                </div>
            </div>

        </div>

    </div>
</section>

{% endblock content %}
